<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <title>Práctica 8 - Viewer</title>

        <!-- CSS -->
        <link rel="stylesheet" href="../css/reset.css">
        <link rel="stylesheet" href="../css/simplegrid.css">
        <link rel="stylesheet" href="../css/icomoon.css">
        <link rel="stylesheet" href="../css/lightcase.css">
        <link rel="stylesheet" href="../style.css">

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,900" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">

        <style>
            body {
                background: url('../images/home.jpg') no-repeat center center fixed;
                background-size: cover;
                margin: 0;
                padding: 0;
            }

            header {
                position: relative;
                padding: 20px 0;
                z-index: 10;
                color: whitesmoke;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .logo-wrap {
                display: flex;
                align-items: center;
                margin-left: 20px;
            }

            .logo-wrap img {
                max-width: 90px;
                height: auto;
                display: block;
                margin-top: -15px;
            }

            .navigation {
                margin-right: 20px;
            }

            .nav-container {
                list-style: none;
                display: flex;
                gap: 15px;
                margin: 0;
                padding: 0;
            }

            .nav-container li {
                display: inline;
            }

            .nav-container li a {
                text-decoration: none;
                color: whitesmoke;
                font-weight: bold;
            }

            .viewer {
                position: relative;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                gap: 20px;
            }

            .viewer h1 {
                margin-top: -15px;
                margin-bottom: 20px;
                font-size: 2rem;
                color: whitesmoke;
            }

            .viewer iframe {
                width: 90%;
                height:90vh;
                border: none;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                background-color: whitesmoke;
            }

            .download-button {
                background-color: transparent;
                border: 2px solid white;
                color: white;
                padding: 10px 30px;
                font-size: 1rem;
                font-weight: bold;
                text-transform: uppercase;
                cursor: pointer;
                border-radius: 50px;
                transition: all 0.3s ease;
                text-decoration: none;
            }

            .download-button:hover {
                background-color: #1abc9c;
                color: white;
                border-color: transparent;
            }
        </style>
    </head>
    <body id="home">
        <!-- Header -->
        <header id="top-header" class="header-home">
            <div class="logo-wrap">
                <a href="../index.html" class="logo"><img src="../images/gti.png" alt="Logo"></a>
            </div>
            <nav class="navigation">
                <input type="checkbox" id="nav-button">
                <label for="nav-button" onclick></label>
                <ul class="nav-container">
                    <li><a href="practica1.html">Practica 1</a></li>
                    <li><a href="practica3.html">Practica 3</a></li>
                    <li><a href="practica4.html">Practica 4</a></li>
                    <li><a href="practica7.html">Practica 7</a></li>
                    <li><a href="practica8.html">Practica 8</a></li>
                    <li><a href="practica9.html">Practica 9</a></li>
                    <li><a href="practica10.html">Practica 10</a></li>
                </ul>
            </nav>
        </header>        
        <!-- End Header -->

        <!-- Viewer -->
        <div class="viewer">
            <h1>Práctica 8</h1>
            <a href="../content/Prac8/practica8.ipynb" class="download-button" download>Descargar Notebook</a>
            <!-- Display HTMLs in Column -->
            <iframe src="../content/Prac8/Accidentes.html" allowfullscreen></iframe>
            <iframe src="../content/Prac8/contenedores.html" allowfullscreen></iframe>
        </div>
        <!-- End Viewer -->

        <!-- Footer -->
        <footer class="wrap">
            <div class="content">
                <p class="footer-text">© 2025 | Jaime Sanchez, Adrian Van Dixhoorn y Jorge Satorres</p>
            </div>
        </footer>
        <!-- End Footer -->

        <!-- JS -->
        <script src="../js/jquery.js"></script>
        <script src="../js/main.js"></script>
    </body>
</html>
